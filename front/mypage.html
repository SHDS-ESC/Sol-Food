<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
        /> -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <title>마이페이지 회원정보 (내 정보 수정)</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/mypage.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="header flex flex-sb">
        <div><strong>로고</strong></div>
        <div style="display: flex; gap: 12px; align-items: center">
          <button
            id="darkmode-toggle"
            style="
              background: none;
              border: none;
              cursor: pointer;
              font-size: 20px;
              color: var(--color-black);
            "
          >
            <i class="bi bi-moon"></i>
          </button>
          <i class="bi bi-list" style="font-size: 20px"></i>
        </div>
      </div>
      <div class="content mypage">
        <div class="info">
          <h1>오*희</h1>
          <p>ogh010@naver.com</p>
        </div>
        <ul>
          <li class="flex flex-sb">
            <p>회원정보 수정</p>
            <i class="bi bi-chevron-right"></i>
          </li>
          <li class="flex flex-sb">
            <p>로그아웃</p>
            <i class="bi bi-chevron-right"></i>
          </li>
          <li class="flex flex-sb">
            <p>회원탈퇴</p>
            <i class="bi bi-chevron-right"></i>
          </li>
        </ul>
      </div>
      <div class="footer flex flex-sa">
        <div class="footer flex flex-sa">
          <div class="bottom-nav">
            <a href="${pageContext.request.contextPath}/"
              ><i class="bi bi-house"></i>홈</a
            >
            <a
              href="${pageContext.request.contextPath}/user/cart"
              class="cart-nav-item"
            >
              <i class="bi bi-bag"></i>장바구니
              <span class="cart-nav-badge">0</span>
            </a>
            <a href="#"><i class="bi bi-calendar2-week"></i>캘린더</a>
            <a href="${pageContext.request.contextPath}/user/mypage/like"
              ><i class="bi bi-heart-fill"></i>찜</a
            >
            <a href="${pageContext.request.contextPath}/user/mypage"
              ><i class="bi bi-person-circle"></i>마이</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="./js/darkmode.js"></script>
  </body>
</html>
