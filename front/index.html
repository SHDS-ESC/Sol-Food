<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <title>solfood</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="header flex flex-sb">
        <div><strong>로고</strong></div>
        <div><i class="bi bi-list" style="font-size: 20px"></i></div>
      </div>
      <div class="content">
        <!-- 셀렉트박스 -->
        <select class="custom-select" style="margin-bottom: 20px">
          <option>선택하세요</option>
          <option>옵션 1</option>
          <option>옵션 2</option>
          <option>옵션 3</option>
        </select>
        <!-- 검색 -->
        <div class="search" style="margin-bottom: 20px">
          <input type="text" class="searchTerm" placeholder="검색" />
          <button type="submit" class="searchButton">
            <span class="ico img"></span>
          </button>
        </div>
        <!-- 인풋 -->
        <form style="margin-bottom: 20px">
          <div class="group">
            <input type="text" required />
            <span class="highlight"></span>
            <span class="bar"></span>
            <label>아이디</label>
          </div>

          <div class="group">
            <input type="text" required />
            <span class="highlight"></span>
            <span class="bar"></span>
            <label>비밀번호</label>
          </div>
        </form>
        <!-- 버튼 -->
        <button class="btn cancle" type="button">취소</button>
        <button class="btn submit" type="submit">확인</button>
      </div>
      <div class="footer flex flex-sa">
        <div class="bottom-nav">
          <a href="${pageContext.request.contextPath}/"
            ><i class="bi bi-house"></i>홈</a
          >
          <a
            href="${pageContext.request.contextPath}/user/cart"
            class="cart-nav-item"
          >
            <i class="bi bi-bag"></i>장바구니
            <span class="cart-nav-badge">0</span>
          </a>
          <a href="#"><i class="bi bi-calendar2-week"></i>캘린더</a>
          <a href="${pageContext.request.contextPath}/user/mypage/like"
            ><i class="bi bi-heart-fill"></i>찜</a
          >
          <a href="${pageContext.request.contextPath}/user/mypage"
            ><i class="bi bi-person-circle"></i>마이</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
