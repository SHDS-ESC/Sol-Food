<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>solfood</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="header flex sb">
        <span class="logo">SOLFOOD</span>
        <span class="menu img"></span>
      </div>
      <div class="content">
        <!-- 셀렉트박스 -->
        <select class="custom-select" style="margin-bottom: 20px">
          <option>선택하세요</option>
          <option>옵션 1</option>
          <option>옵션 2</option>
          <option>옵션 3</option>
        </select>
        <!-- 검색 -->
        <div class="search" style="margin-bottom: 20px">
          <input type="text" class="searchTerm" placeholder="검색" />
          <button type="submit" class="searchButton">
            <span class="ico img"></span>
          </button>
        </div>
        <!-- 인풋 -->
        <form style="margin-bottom: 20px">
          <div class="group">
            <input type="text" required />
            <span class="highlight"></span>
            <span class="bar"></span>
            <label>아이디</label>
          </div>

          <div class="group">
            <input type="text" required />
            <span class="highlight"></span>
            <span class="bar"></span>
            <label>비밀번호</label>
          </div>
        </form>
        <!-- 버튼 -->
        <button class="btn cancle" type="button">취소</button>
        <button class="btn submit" type="submit">확인</button>
      </div>
      <div class="footer flex sa">
        <span class="ico img"></span>
        <span class="ico img"></span>
        <span class="ico img"></span>
        <span class="ico img"></span>
      </div>
    </div>
  </body>
</html>
