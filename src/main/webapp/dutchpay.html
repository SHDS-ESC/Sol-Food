<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Sol Food 더치페이</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 255, 255, 0.8); }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .auto-load-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .mode-btn {
            padding: 1rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .mode-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            transform: scale(1.05);
        }

        .member-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .member-tag {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            color: #2d3436;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .member-tag:hover {
            transform: rotate(-5deg) scale(1.1);
        }

        .amount-display {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        .epic-button {
            width: 100%;
            padding: 1.5rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .epic-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .epic-button:active {
            transform: scale(0.98);
        }

        .roulette {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7, #fd79a8);
            margin: 2rem auto;
            position: relative;
            transition: transform 3s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .roulette-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
            z-index: 10;
        }

        .result-section {
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .winner {
            font-size: 2rem;
            color: #ffeaa7;
            font-weight: bold;
            margin-bottom: 1rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .split-result {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }

        .person-amount {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .hidden {
            display: none;
        }

        .card-game {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .card {
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: rotateY(180deg) scale(1.1);
        }

        .card.flipped {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Sol Food 더치페이</h1>
        <p class="subtitle">결제 대기 중 즐기는 미니게임</p>

        <div id="autoLoadMessage" class="auto-load-message hidden">
            🎮 참가자와 금액이 자동으로 설정되었습니다!
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="roulette">🎰 룰렛</button>
            <button class="mode-btn" data-mode="card">🃏 카드뽑기</button>
            <button class="mode-btn" data-mode="split">💸 균등분할</button>
            <button class="mode-btn" data-mode="random">🎲 랜덤픽</button>
        </div>

        <div class="member-list" id="memberList"></div>
        <div class="amount-display" id="amountDisplay">총 금액: ₩0</div>

        <button class="epic-button" id="startButton">🚀 게임 시작!</button>

        <div id="gameArea" class="hidden"></div>
        <div id="resultArea" class="hidden"></div>
    </div>

    <script>
        let members = [];
        let currentMode = 'roulette';
        let totalAmount = 0;

        const memberList = document.getElementById('memberList');
        const amountDisplay = document.getElementById('amountDisplay');
        const startButton = document.getElementById('startButton');
        const gameArea = document.getElementById('gameArea');
        const resultArea = document.getElementById('resultArea');
        const autoLoadMessage = document.getElementById('autoLoadMessage');

        // 페이지 로드 시 URL 파라미터에서 데이터 자동 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadDataFromURL();
        });

        // 전역 변수
        let returnUrl = '';

        // URL 파라미터에서 데이터 로드
        function loadDataFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            // 돌아갈 URL 저장
            const returnUrlParam = urlParams.get('returnUrl');
            if (returnUrlParam) {
                returnUrl = decodeURIComponent(returnUrlParam);
            }
            
            if (encodedData) {
                try {
                    // Base64 디코딩 후 JSON 파싱
                    const decodedData = JSON.parse(decodeURIComponent(atob(encodedData)));
                    
                    console.log('🎮 Sol Food에서 전달받은 데이터:', decodedData);
                    
                    // 멤버 리스트 설정
                    if (decodedData.members && Array.isArray(decodedData.members)) {
                        members = decodedData.members;
                        updateMemberList();
                    }
                    
                    // 총 금액 설정
                    if (decodedData.amount && decodedData.amount > 0) {
                        totalAmount = decodedData.amount;
                        updateAmountDisplay();
                    }
                    
                    // 자동 로드 메시지 표시
                    if (members.length > 0 && totalAmount > 0) {
                        autoLoadMessage.classList.remove('hidden');
                        autoLoadMessage.innerHTML = `
                            🎮 Sol Food에서 자동 설정 완료!<br>
                            👥 참가자: ${members.length}명 | 💰 총 금액: ₩${totalAmount.toLocaleString()}
                        `;
                        
                        // 5초 후 메시지 숨기기
                        setTimeout(() => {
                            autoLoadMessage.classList.add('hidden');
                        }, 5000);
                        
                        // 반짝 효과
                        createFloatingEmoji('✨');
                        setTimeout(() => createFloatingEmoji('🎉'), 500);
                        setTimeout(() => createFloatingEmoji('🎮'), 1000);
                    }
                    
                } catch (error) {
                    console.error('데이터 로드 오류:', error);
                    // 오류 시 기본값 설정
                    setDefaultData();
                }
            } else {
                // URL 파라미터가 없는 경우 기본값 설정
                setDefaultData();
            }
        }

        function setDefaultData() {
            members = ['홍길동', '김철수', '이영희'];
            totalAmount = 30000;
            updateMemberList();
            updateAmountDisplay();
        }

        function updateMemberList() {
            memberList.innerHTML = members.map(member => 
                `<span class="member-tag">${member}</span>`
            ).join('');
        }

        function updateAmountDisplay() {
            amountDisplay.textContent = `총 금액: ₩${totalAmount.toLocaleString()}`;
        }

        // 모드 선택
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        function createFloatingEmoji(emoji) {
            const floatingEmoji = document.createElement('div');
            floatingEmoji.className = 'floating-emoji';
            floatingEmoji.textContent = emoji;
            floatingEmoji.style.left = Math.random() * 80 + 10 + '%';
            floatingEmoji.style.top = Math.random() * 50 + 25 + '%';
            document.querySelector('.container').appendChild(floatingEmoji);
            
            setTimeout(() => floatingEmoji.remove(), 3000);
        }

        // 게임 시작
        startButton.addEventListener('click', () => {
            if (members.length < 2) {
                alert('최소 2명 이상 필요해요! 🙅‍♂️');
                return;
            }
            
            if (totalAmount <= 0) {
                alert('금액 정보가 없습니다! 💰');
                return;
            }

            gameArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            startGame();
        });

        function startGame() {
            gameArea.innerHTML = '';
            
            switch (currentMode) {
                case 'roulette':
                    startRoulette();
                    break;
                case 'card':
                    startCardGame();
                    break;
                case 'split':
                    startSplitPay();
                    break;
                case 'random':
                    startRandomPick();
                    break;
            }
        }

        function startRoulette() {
            gameArea.innerHTML = `
                <div class="roulette" id="roulette">
                    <div class="roulette-pointer"></div>
                </div>
                <button class="epic-button" onclick="spinRoulette()">🎯 룰렛 돌리기!</button>
            `;
        }

        function spinRoulette() {
            const roulette = document.getElementById('roulette');
            const spins = Math.random() * 1800 + 1800; // 5-10바퀴
            roulette.style.transform = `rotate(${spins}deg)`;
            
            setTimeout(() => {
                const winner = members[Math.floor(Math.random() * members.length)];
                showResult(`🎉 ${winner}님이 ${totalAmount.toLocaleString()}원 결제!`, 'winner');
                createFloatingEmoji('🎊');
            }, 3000);
        }

        function startCardGame() {
            const cards = members.map((member, index) => ({
                name: member,
                value: Math.floor(Math.random() * 13) + 1
            }));

            gameArea.innerHTML = `
                <h3 style="color: white; margin-bottom: 1rem;">카드를 클릭해서 뽑아보세요!</h3>
                <div class="card-game">
                    ${cards.map((card, index) => 
                        `<div class="card" onclick="flipCard(${index})" id="card-${index}">
                            ${card.name}
                        </div>`
                    ).join('')}
                </div>
            `;

            window.cardData = cards;
        }

        function flipCard(index) {
            const card = document.getElementById(`card-${index}`);
            const cardData = window.cardData[index];
            
            card.classList.add('flipped');
            card.innerHTML = `${cardData.value}<br>${cardData.name}`;
            
            setTimeout(() => {
                const allFlipped = document.querySelectorAll('.card.flipped').length === members.length;
                if (allFlipped) {
                    const highest = window.cardData.reduce((prev, current) => 
                        prev.value > current.value ? prev : current
                    );
                    showResult(`🎴 ${highest.name}님이 ${highest.value} 뽑아서 ${totalAmount.toLocaleString()}원 결제!`, 'winner');
                }
            }, 500);
        }

        function startSplitPay() {
            const perPerson = Math.floor(totalAmount / members.length);
            const remainder = totalAmount % members.length;
            
            const results = members.map((member, index) => ({
                name: member,
                amount: perPerson + (index < remainder ? 1 : 0)
            }));

            let resultHTML = '<div class="split-result">';
            results.forEach(result => {
                resultHTML += `
                    <div class="person-amount">
                        <span style="color: white; font-weight: bold;">${result.name}</span>
                        <span style="color: #ffeaa7; font-size: 1.2rem;">${result.amount.toLocaleString()}원</span>
                    </div>
                `;
            });
            resultHTML += '</div>';

            showResult('💸 균등 분할 결과', 'split', resultHTML);
        }

        function startRandomPick() {
            const randomMember = members[Math.floor(Math.random() * members.length)];
            
            // 랜덤 애니메이션 효과
            let counter = 0;
            const interval = setInterval(() => {
                const randomName = members[Math.floor(Math.random() * members.length)];
                gameArea.innerHTML = `
                    <div style="font-size: 3rem; color: white; margin: 2rem 0;">
                        ${randomName}
                    </div>
                `;
                counter++;
                
                if (counter > 20) {
                    clearInterval(interval);
                    showResult(`🎲 ${randomMember}님이 랜덤 선택! ${totalAmount.toLocaleString()}원 결제!`, 'winner');
                }
            }, 100);
        }

        function showResult(message, type, additionalContent = '') {
            resultArea.classList.remove('hidden');
            
            if (type === 'winner') {
                // 결제자 정보를 전역 변수에 저장
                const winner = extractWinnerFromMessage(message);
                window.gameResult = {
                    type: 'winner',
                    winner: winner,
                    amount: totalAmount,
                    members: members
                };
                
                resultArea.innerHTML = `
                    <div class="result-section">
                        <div class="winner">${message}</div>
                        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button class="epic-button" onclick="resetGame()" style="flex: 1;">🔄 다시하기</button>
                            <button class="epic-button" onclick="applyResult()" style="flex: 1; background: linear-gradient(135deg, #4ecdc4, #44a08d);">✅ 결과 적용</button>
                        </div>
                    </div>
                `;
            } else if (type === 'split') {
                // 분할 정보를 전역 변수에 저장
                const splitAmounts = extractSplitAmounts(additionalContent);
                window.gameResult = {
                    type: 'split',
                    splitAmounts: splitAmounts,
                    amount: totalAmount,
                    members: members
                };
                
                resultArea.innerHTML = `
                    <div class="result-section">
                        <h3 style="color: white; margin-bottom: 1rem;">${message}</h3>
                        ${additionalContent}
                        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button class="epic-button" onclick="resetGame()" style="flex: 1;">🔄 다시하기</button>
                            <button class="epic-button" onclick="applyResult()" style="flex: 1; background: linear-gradient(135deg, #4ecdc4, #44a08d);">✅ 결과 적용</button>
                        </div>
                    </div>
                `;
            }
            
            // 승리 이모지 효과
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createFloatingEmoji(['🎉', '🎊', '💸', '🔥', '✨'][i]), i * 200);
            }
        }

        // 메시지에서 결제자 이름 추출
        function extractWinnerFromMessage(message) {
            const match = message.match(/([^님]+)님이.*결제!/);
            return match ? match[1] : members[0];
        }

        // HTML에서 분할 금액 정보 추출
        function extractSplitAmounts(htmlContent) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');
            const personAmounts = doc.querySelectorAll('.person-amount');
            
            const splitAmounts = {};
            personAmounts.forEach(element => {
                const nameSpan = element.querySelector('span:first-child');
                const amountSpan = element.querySelector('span:last-child');
                if (nameSpan && amountSpan) {
                    const name = nameSpan.textContent.trim();
                    const amount = parseInt(amountSpan.textContent.replace(/[^\d]/g, ''));
                    splitAmounts[name] = amount;
                }
            });
            
            return splitAmounts;
        }

        // 게임 결과를 수락 대기 페이지로 적용
        function applyResult() {
            if (!window.gameResult || !returnUrl) {
                alert('결과 적용에 필요한 정보가 없습니다.');
                return;
            }

            // 게임 결과를 URL 파라미터로 인코딩
            const resultData = JSON.stringify(window.gameResult);
            const encodedResult = btoa(encodeURIComponent(resultData));
            
            // 수락 대기 페이지로 돌아가면서 결과 전달
            const separator = returnUrl.includes('?') ? '&' : '?';
            const returnUrlWithResult = `${returnUrl}${separator}gameResult=${encodedResult}`;
            
            console.log('🎮 게임 결과 적용:', window.gameResult);
            
            window.location.href = returnUrlWithResult;
        }

        function resetGame() {
            gameArea.classList.add('hidden');
            resultArea.classList.add('hidden');
            gameArea.innerHTML = '';
            resultArea.innerHTML = '';
        }
    </script>
</body>
</html>
